<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plataforma de Avaliação Técnica</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: cabeçalho azul-marinho com escalão e separadores; por baixo, ficha à esquerda e gráficos à direita, empilhados no telemóvel */
:root{
  --bg:#FFFFFF; --surface:#F4F7FB; --ink:#14274E; --muted:#56678A; --line:#D3DCE9;
  --accent:#E8641B; --accent-ink:#FFFFFF; --head:#14274E; --head-ink:#FFFFFF; --sky:#D9EAF9; --warn:#B3261E;
  --l1:#D6E6F7; --l2:#A6C8EC; --l3:#6C9FD6; --l4:#35689F; --l5:#14274E;
  --font-d:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --font-b:"Barlow","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A2E; --surface:#172642; --ink:#E8EDF5; --muted:#9FB0C9; --line:#2A3C5E;
    --accent:#FF8A3D; --accent-ink:#14274E; --head:#0B1424; --head-ink:#E8EDF5; --sky:#1E3559; --warn:#FF8A80;
    --l1:#27406A; --l2:#3F679F; --l3:#6C9FD6; --l4:#A6C8EC; --l5:#E3EEFA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A2E; --surface:#172642; --ink:#E8EDF5; --muted:#9FB0C9; --line:#2A3C5E;
  --accent:#FF8A3D; --accent-ink:#14274E; --head:#0B1424; --head-ink:#E8EDF5; --sky:#1E3559; --warn:#FF8A80;
  --l1:#27406A; --l2:#3F679F; --l3:#6C9FD6; --l4:#A6C8EC; --l5:#E3EEFA; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font-b)}
h1,h2,h3{font-family:var(--font-d);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:1.7rem} h2{font-size:1.45rem;margin-bottom:.6rem} h3{font-size:1.12rem;margin:1.1rem 0 .4rem}
p{margin:.4rem 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:.875rem} .num{font-variant-numeric:tabular-nums}

header.top{background:var(--head);color:var(--head-ink);padding:1rem 16px 0}
.top-in,.wrap{max-width:1080px;margin:0 auto}
.top-row{display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:flex-end;justify-content:space-between}
.top .team{opacity:.8;font-size:.95rem}
#status{font-size:.8rem;opacity:.75;min-height:1.2em;margin-top:.25rem}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:inherit;padding:.4rem .9rem;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs{display:flex;gap:.25rem;margin-top:.9rem;overflow-x:auto}
nav.tabs button{background:none;border:0;color:inherit;opacity:.75;padding:.6rem .9rem;cursor:pointer;font-weight:600;border-bottom:4px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{opacity:1;border-bottom-color:var(--accent)}

main{padding:1.25rem 16px 3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem;margin-bottom:1rem;min-width:0}
.cols{display:grid;gap:1rem;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.cols>div{min-width:0}
@media (max-width:840px){.cols{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .85rem;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;max-width:100%}
textarea{width:100%;min-height:5.5rem;resize:vertical}
label{font-weight:600;font-size:.9rem}
.scroll{overflow-x:auto}
.notice{border-left:4px solid var(--accent);padding:.5rem .8rem;background:var(--sky);border-radius:0 8px 8px 0}

.alist{list-style:none;margin:0;padding:0}
.alist li+li{border-top:1px solid var(--line)}
.alist button{display:flex;width:100%;gap:.75rem;align-items:center;justify-content:space-between;background:none;border:0;padding:.7rem .25rem;cursor:pointer;text-align:left}
.alist .nm{font-weight:600}
.alist .go{color:var(--accent);font-weight:600;white-space:nowrap}

.scale{display:flex;flex-wrap:wrap;gap:.3rem .9rem;font-size:.85rem;margin:.6rem 0 .2rem;padding:0;list-style:none}
.scale b{font-family:var(--font-d);font-size:1rem;margin-right:.25rem}
.comp{padding:.75rem 0;border-top:1px solid var(--line)}
.comp-h{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline}
.comp .cn{font-weight:600}
.comp .ix{display:inline-block;width:1.5rem;font-family:var(--font-d);font-weight:700;color:var(--accent);font-size:1.15rem}
.lvls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;margin-top:.45rem}
.lvls button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.45rem 0;cursor:pointer;font-family:var(--font-d);font-weight:700;font-size:1.15rem}
.lvls button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.def{background:var(--sky);border-radius:8px;padding:.8rem;margin-top:.9rem}
.def h3{margin-top:0}
.def input{width:6.2rem}
.res{display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;margin-top:.6rem}
.res div span{display:block;font-size:.8rem;color:var(--muted)}
.res div b{font-family:var(--font-d);font-size:1.35rem}

table.grid{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
table.grid th,table.grid td{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:center}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid thead th{font-weight:600;color:var(--muted);white-space:nowrap}
table.grid tfoot td{font-weight:600}
table.sheet td,table.sheet th{white-space:nowrap}
table.cfg input[type=text]{width:100%;min-width:11rem}
.legend{list-style:none;margin:.5rem 0 0;padding:0;font-size:.875rem;columns:2;column-gap:1rem}
.legend b{color:var(--accent);font-family:var(--font-d);font-size:1rem;margin-right:.3rem}
@media (max-width:480px){.legend{columns:1}}
.key{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.82rem;color:var(--muted);margin:.4rem 0}
.key i{display:inline-block;width:1.4rem;height:0;border-top:3px solid var(--accent);vertical-align:middle;margin-right:.35rem}
.key i.dash{border-top:2px dashed var(--muted)}
.key i.sw{height:.8rem;border:0;border-radius:3px;width:.8rem}
.radar{display:block;margin:0 auto;max-width:100%;height:auto}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
.minis figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:.5rem .5rem .2rem;min-width:0}
.minis figcaption{font-size:.8rem;font-weight:600;line-height:1.2;min-height:2.4em}
.minis svg{display:block;width:100%;height:auto}
.dist{display:grid;grid-template-columns:minmax(0,11rem) minmax(0,1fr) 2.2rem;gap:.45rem .6rem;align-items:center;font-size:.875rem}
.dist .bar{display:flex;gap:2px;height:1.05rem}
.dist .bar span{border-radius:3px;min-width:3px}
.dist .n{text-align:right;color:var(--muted)}
.report{max-width:68ch}
.report ul{padding-left:1.2rem;margin:.3rem 0}
.report h3{color:var(--accent)}
.court{display:block;max-width:300px;width:100%;height:auto;margin:0 auto}
</style>

<div lang="pt-PT">
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div>
        <h1>Plataforma de Avaliação Técnica</h1>
        <div class="team" id="teamline">Basquetebol de formação · Sub-8, Sub-10 e Sub-12</div>
      </div>
      <div>
        <div class="seg" role="group" aria-label="Escalão" id="escseg"></div>
        <div id="status" role="status"></div>
      </div>
    </div>
    <nav class="tabs" aria-label="Secções" id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="app"><section class="card"><h2>A abrir a tua equipa</h2><p class="muted">Aqui aparecem os atletas, as fichas de avaliação e os gráficos de evolução.</p></section></div></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ---------- dados de base ---------- */
const DEF_COMPS=["Lançamento","Drible / Domínio da Bola","Passe","Receção da Bola","Trabalho de Pés","Finalizações","Defesa Individual","Tática Individual","Contra-Ataque"];
const DEF_LEVELS=["Inicial","Em desenvolvimento","Satisfatório","Bom","Muito bom"];
const ESC={"8":"Sub-8","10":"Sub-10","12":"Sub-12"};
/* Teste de Movimentos Defensivos: tempos (s) por idade e percentil, transcritos da tabela de Matulaitis, K. et al. (2019) */
const REF={src:"Matulaitis, K. et al. (2019)",p:[90,80,70,60,50,40,30,20,10],t:{
  8:[9.67,9.69,10.3,10.32,10.43,10.5,10.79,11.08,11.36],
  9:[9.59,9.66,9.94,10.15,10.36,10.57,10.69,10.78,11.09],
  10:[8.88,9.04,9.32,9.63,9.84,9.94,10.05,10.39,10.92],
  11:[9,9.2,9.4,9.6,9.7,9.8,10.03,10.3,10.6],
  12:[8.3,8.7,8.9,9.03,9.26,9.4,9.5,9.79,10.3],
  13:[7.81,8.04,8.25,8.4,8.66,8.97,9.3,9.6,10.2],
  14:[7.72,8.09,8.2,8.28,8.4,8.67,8.9,9.17,9.6],
  15:[7.27,7.7,7.54,7.73,7.9,8.09,8.16,8.4,8.78],
  16:[7.3,7.42,7.53,7.7,7.83,7.9,8.01,8.2,8.49],
  17:[7.4,7.7,7.8,8,8.11,8.2,8.3,8.61,8.7]}};
const P_PAGE={accent:"var(--accent)",line:"var(--line)",ink:"var(--ink)",muted:"var(--muted)",bg:"var(--bg)"};
const LS_KEY="pat-enb-v1";

const state={config:null,athletes:{}};
const ui={tab:"equipa",esc:"8",mid:null,aid:null,rep:"pais",confirmDel:null,confirmWipe:false,msg:""};
let col=null,mode="local",dl=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=v=>v==null?"–":v.toFixed(1).replace(".",",");
const fmtT=v=>v==null?"–":v.toFixed(2).replace(".",",")+" s";
const clone=o=>JSON.parse(JSON.stringify(o));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtD=s=>s?s.split("-").reverse().join("/"):"";
const first=a=>a.name.split(" ")[0];

function defConfig(){return{team:"",levels:DEF_LEVELS.slice(),
  comps:DEF_COMPS.map((n,i)=>({id:"c"+(i+1),name:n,on:{"8":true,"10":true,"12":true}})),
  moments:[{id:"m1",label:"Inicial"},{id:"m2",label:"Intermédia 1"},{id:"m3",label:"Intermédia 2"},{id:"m4",label:"Final"}]}}
function normalize(){
  const d=defConfig(),c=state.config||{};
  if(!Array.isArray(c.comps)||!c.comps.length)c.comps=d.comps;
  c.comps.forEach(k=>{if(!k.on)k.on={"8":true,"10":true,"12":true}});
  if(!Array.isArray(c.levels)||c.levels.length!==5)c.levels=d.levels;
  if(!Array.isArray(c.moments)||!c.moments.length)c.moments=d.moments;
  if(typeof c.team!=="string")c.team="";
  state.config=c;
  for(const a of Object.values(state.athletes)){if(!a.evals)a.evals={};if(!ESC[a.esc])a.esc="8"}
}

/* ---------- gravação ---------- */
const timers={},busy={},again={};
function setStatus(t){$("#status").textContent=t}
function idleStatus(){setStatus(mode==="db"?"Guardado na tua conta":"Guardado só neste dispositivo")}
function save(id){
  if(mode==="local"){
    try{localStorage.setItem(LS_KEY,JSON.stringify(state));idleStatus()}catch(e){setStatus("Não foi possível guardar neste dispositivo")}
    return;
  }
  setStatus("A guardar…");clearTimeout(timers[id]);timers[id]=setTimeout(()=>flush(id),700);
}
async function flush(id){
  if(busy[id]){again[id]=true;return}
  busy[id]=true;
  try{
    const data=id==="config"?state.config:state.athletes[id];
    if(data)await col.doc(id).set(clone(data));else await col.doc(id).delete();
    idleStatus();
  }catch(e){
    setStatus(e&&e.code==="quota_exceeded"?"Espaço cheio: apaga atletas antigos":"Não foi possível guardar. Verifica a ligação e altera de novo.");
  }
  busy[id]=false;
  if(again[id]){again[id]=false;flush(id)}
}

/* ---------- cálculos ---------- */
const moments=()=>state.config.moments, levels=()=>state.config.levels;
const compsOf=e=>state.config.comps.filter(c=>c.on[e]!==false);
const byEsc=e=>Object.values(state.athletes).filter(a=>a.esc===e).sort((a,b)=>a.name.localeCompare(b.name,"pt"));
const ev=(a,mid)=>a.evals[mid]||null;
const sc=(a,mid,cid)=>{const e=ev(a,mid);return (e&&e.s&&e.s[cid])||0};
const vals=(a,mid,cs)=>cs.map(c=>sc(a,mid,c.id));
function best(a,mid){const e=ev(a,mid);if(!e||!e.def)return null;const v=e.def.filter(x=>typeof x==="number"&&x>0);return v.length?Math.min(...v):null}
const hasScores=(a,mid)=>compsOf(a.esc).some(c=>sc(a,mid,c.id)>0);
const hasEval=(a,mid)=>hasScores(a,mid)||best(a,mid)!=null;
function mean(arr){const v=arr.filter(x=>x>0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
const teamMeans=(e,mid,cs)=>cs.map(c=>mean(byEsc(e).map(a=>sc(a,mid,c.id))));
const teamHas=(e,mid)=>byEsc(e).some(a=>hasScores(a,mid));
function prevMoment(mid,has){const ms=moments(),i=ms.findIndex(m=>m.id===mid);for(let k=i-1;k>=0;k--)if(has(ms[k].id))return ms[k];return null}
const mLabel=mid=>{const m=moments().find(m=>m.id===mid);return m?m.label:""};
function curMid(){
  const ms=moments();
  if(ui.mid&&ms.some(m=>m.id===ui.mid))return ui.mid;
  let pick=ms[0].id;
  for(const m of ms)if(Object.values(state.athletes).some(a=>hasEval(a,m.id)))pick=m.id;
  return pick;
}
function ageAt(birth,date){
  if(!birth)return null;const b=birth.split("-").map(Number),d=(date||today()).split("-").map(Number);
  let y=d[0]-b[0];if(d[1]<b[1]||(d[1]===b[1]&&d[2]<b[2]))y--;return y>=0&&y<100?y:null;
}
/* Faixa de percentil: a tabela dá um tempo por decil, por isso o resultado é o intervalo entre dois decis, sem interpolação */
function band(t,age){
  const r=REF.t[age];if(!r||t==null)return null;
  if(t<=r[0])return"acima de P90";
  for(let i=1;i<9;i++)if(t<=r[i])return"P"+REF.p[i]+"-P"+REF.p[i-1];
  return"abaixo de P10";
}
function defInfo(a,mid){
  const e=ev(a,mid),b=best(a,mid),age=ageAt(a.birth,e&&e.date);
  let why="";
  if(b!=null){if(age==null)why="Falta a data de nascimento";else if(!REF.t[age])why="Sem valores de referência para "+age+" anos"}
  return{best:b,age,band:b!=null&&age!=null?band(b,age):null,why,tries:(e&&e.def)||[]};
}
function teamTimes(e,mid){return byEsc(e).map(a=>best(a,mid)).filter(v=>v!=null)}
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;

/* ---------- gráficos ---------- */
function tint(v){return v?`color-mix(in srgb, var(--accent) ${Math.round(12+13*v)}%, transparent)`:"none"}
function radar(vs,prev,names,size){
  size=size||300;const n=vs.length,c=size/2,R=size/2-34;
  const pt=(v,i)=>{const t=(-90+360*i/n)*Math.PI/180;return[(c+R*v/5*Math.cos(t)).toFixed(1),(c+R*v/5*Math.sin(t)).toFixed(1)]};
  const P=P_PAGE;
  let s=`<svg class="radar" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Perfil por competência, níveis de 1 a 5">`;
  for(let k=1;k<=5;k++)s+=`<polygon points="${vs.map((_,i)=>pt(k,i).join(",")).join(" ")}" fill="none" stroke="${P.line}" stroke-width="1"/>`;
  for(let i=0;i<n;i++){const p=pt(5,i),q=pt(5.75,i);
    s+=`<line x1="${c}" y1="${c}" x2="${p[0]}" y2="${p[1]}" stroke="${P.line}" stroke-width="1"/><text x="${q[0]}" y="${q[1]}" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="${P.ink}" font-family="Barlow Condensed,Arial Narrow,Arial,sans-serif">${i+1}</text>`}
  const poly=arr=>arr.map((v,i)=>v>0?pt(v,i):null).filter(Boolean);
  if(prev){const pp=poly(prev);if(pp.length>1)s+=`<polygon points="${pp.map(p=>p.join(",")).join(" ")}" fill="none" stroke="${P.muted}" stroke-width="2" stroke-dasharray="5 4"/>`}
  const cp=poly(vs);
  if(cp.length>1)s+=`<polygon points="${cp.map(p=>p.join(",")).join(" ")}" fill="${P.accent}" fill-opacity=".2" stroke="${P.accent}" stroke-width="2.5" stroke-linejoin="round"/>`;
  vs.forEach((v,i)=>{if(v>0){const p=pt(v,i);s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="${P.accent}" stroke="${P.bg}" stroke-width="2"><title>${esc(names[i])}: ${fmt(v)}</title></circle>`}});
  return s+"</svg>";
}
function legend(cs){return `<ol class="legend">${cs.map((c,i)=>`<li><b>${i+1}</b>${esc(c.name)}</li>`).join("")}</ol>`}
function radarKey(cur,pm){return `<div class="key"><span><i></i>${esc(cur)}</span>${pm?`<span><i class="dash"></i>${esc(pm)}</span>`:""}</div>`}
/* gráfico pequeno de evolução: um por competência, sempre na mesma escala */
function mini(title,vs,o){
  const labels=moments().map(m=>m.label),n=vs.length,W=170,H=84,l=10,r=34,t=10,b=18,P=P_PAGE;
  const x=i=>n===1?(l+W-r)/2:l+(W-l-r)*i/(n-1),y=v=>t+(H-t-b)*(o.max-v)/(o.max-o.min||1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: evolução por momento">`;
  for(const k of o.ticks)s+=`<line x1="${l}" x2="${W-r}" y1="${y(k).toFixed(1)}" y2="${y(k).toFixed(1)}" stroke="${P.line}" stroke-width="1"/>`;
  s+=`<text x="${l}" y="${H-4}" font-size="10" fill="${P.muted}">${esc(labels[0])}</text>`;
  if(n>1)s+=`<text x="${W-r}" y="${H-4}" font-size="10" text-anchor="end" fill="${P.muted}">${esc(labels[n-1])}</text>`;
  const pts=vs.map((v,i)=>v==null||v===0?null:[x(i),y(v),v,i]).filter(Boolean);
  if(!pts.length)s+=`<text x="${(l+W-r)/2}" y="${H/2}" text-anchor="middle" font-size="11" fill="${P.muted}">Sem dados</text>`;
  if(pts.length>1)s+=`<polyline points="${pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${P.accent}" stroke-width="2" stroke-linejoin="round"/>`;
  pts.forEach((p,k)=>{const last=k===pts.length-1;
    s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${last?4.5:3.5}" fill="${P.accent}" stroke="${P.bg}" stroke-width="2"><title>${esc(labels[p[3]])}: ${o.f(p[2])}</title></circle>`;

function repHead(title,parts){return{title,sub:parts.filter(Boolean).join(" · "),blocks:[]}}
function repAthlete(a,mid,parents){
  const cs=compsOf(a.esc),s=vals(a,mid,cs),lv=levels(),pm=prevMoment(mid,m=>hasScores(a,m)),ps=pm?vals(a,pm.id,cs):null,nm=first(a),e=ev(a,mid);

  let work=idx.filter(i=>s[i]<=2&&!strong.includes(i));if(!work.length)work=[...sorted].reverse().filter(i=>s[i]<5&&!strong.includes(i)).slice(0,2);

  if(parents){
    if(idx.length){B.push({t:"h",x:"O que está a correr bem"},{t:"ul",items:strong.map(line)});
      if(work.length)B.push({t:"h",x:"Em que estamos a trabalhar"},{t:"ul",items:work.map(line)})}
    if(pm&&idx.length)B.push({t:"h",x:"Evolução desde «"+pm.label+"»"},{t:"p",x:up.length?nm+" progrediu em "+names(up)+".":nm+" manteve o nível nas competências avaliadas, o que é normal entre dois momentos próximos."});
    if(di.best!=null)B.push({t:"h",x:"Deslocamento defensivo"},{t:"p",x:nm+" completou o percurso de deslizamento defensivo em "+fmtT(di.best)+" (melhor de três tentativas)."+(pd!=null?(di.best<pd?" Melhorou "+fmtT(pd-di.best)+" em relação a «"+pm.label+"».":" Em «"+pm.label+"» tinha feito "+fmtT(pd)+"."):"")});
    if(note)B.push({t:"h",x:"Nota do treinador"},{t:"p",x:note});
    B.push({t:"h",x:"Como ler este relatório"},{t:"p",x:"Cada competência é observada numa escala de 1 ("+lv[0]+") a 5 ("+lv[4]+"). Cada criança aprende ao seu ritmo: o relatório descreve o momento atual e o caminho feito por "+nm+", não compara crianças entre si."});
  }else{
    const tm=teamMeans(a.esc,mid,cs);
    if(idx.length){
      B.push({t:"table",head:["Competência","Nível",pm?pm.label:"Anterior","Variação","Média "+ESC[a.esc]],w:[.4,.12,.16,.14,.18],rows:cs.map((c,i)=>[(i+1)+". "+c.name,s[i]?String(s[i]):"-",ps&&ps[i]?String(ps[i]):"-",s[i]&&ps&&ps[i]?(s[i]>ps[i]?"+":"")+(s[i]-ps[i]):"-",fmt(tm[i]).replace("–","-")])});
      B.push({t:"h",x:"Pontos fortes"},{t:"ul",items:strong.map(line)});
      if(work.length)B.push({t:"h",x:"Prioridades para o próximo ciclo"},{t:"ul",items:work.slice(0,3).map(line)});
      if(pm)B.push({t:"h",x:"Desde «"+pm.label+"»"},{t:"p",x:(up.length?"Subiu em "+names(up)+". ":"")+(down.length?"Desceu em "+names(down)+". ":"")+(!up.length&&!down.length?"Sem alterações de nível.":"")});
    }
    if(di.best!=null){
      const tr=di.tries.filter(x=>typeof x==="number").map(x=>x.toFixed(2).replace(".",",")).join(" · ");
      B.push({t:"h",x:"Teste de movimentos defensivos"},{t:"p",x:"Tentativas: "+tr+" s. Melhor tempo: "+fmtT(di.best)+"."+(di.band?" Percentil para "+di.age+" anos: "+di.band+" ("+REF.src+").":" "+(di.why||"Sem percentil")+".")+(pd!=null?" Em «"+pm.label+"»: "+fmtT(pd)+" ("+(di.best<=pd?"-":"+")+Math.abs(di.best-pd).toFixed(2).replace(".",",")+" s).":"")});
    }
    if(note)B.push({t:"h",x:"Nota"},{t:"p",x:note});
  }
  return r;
}

    B.push({t:"radar",names:cs.map(c=>c.name),vals:tm.map(v=>v||0),prev:pt?pt.map(v=>v||0):null,side:cs.map((c,i)=>tm[i]?"média "+fmt(tm[i]):"por avaliar"),key:"«"+mLabel(mid)+"»"+(pm?" (linha cheia) e «"+pm.label+"» (tracejado)":"")});
    B.push({t:"table",head:["Competência","Média",pm?pm.label:"Anterior","Variação","Níveis 1 e 2"],w:[.4,.13,.17,.14,.16],rows:order.map(i=>[(i+1)+". "+cs[i].name,fmt(tm[i]),pt&&pt[i]?fmt(pt[i]):"-",pt&&pt[i]?(tm[i]-pt[i]>=0?"+":"-")+Math.abs(tm[i]-pt[i]).toFixed(1).replace(".",","):"-",String(done.filter(a=>{const v=sc(a,mid,cs[i].id);return v===1||v===2}).length)])});
    B.push({t:"h",x:"Onde a equipa está mais forte"},{t:"ul",items:order.slice(0,2).map(i=>cs[i].name+": média "+fmt(tm[i])+".")});
    B.push({t:"h",x:"Prioridades coletivas"},{t:"ul",items:order.slice(-2).reverse().map(i=>{const who=done.filter(a=>sc(a,mid,cs[i].id)===1).map(a=>a.name);return cs[i].name+": média "+fmt(tm[i])+"."+(who.length?" A acompanhar de perto: "+who.join(", ")+".":"")})});
    if(pt){const ch=order.filter(i=>pt[i]).map(i=>[i,tm[i]-pt[i]]).sort((x,y)=>y[1]-x[1]);if(ch.length&&ch[0][1]>.05)B.push({t:"h",x:"Maior progresso desde «"+pm.label+"»"},{t:"p",x:cs[ch[0][0]].name+" (+"+ch[0][1].toFixed(1).replace(".",",")+")."})}
  }
  if(tt.length){
    const bands={};list.forEach(a=>{const d=defInfo(a,mid);if(d.best!=null){const k=d.band||"sem referência";bands[k]=(bands[k]||0)+1}});
    B.push({t:"h",x:"Teste de movimentos defensivos"},{t:"p",x:tt.length+" atletas com tempo. Média: "+fmtT(avg(tt))+". Mais rápido: "+fmtT(Math.min(...tt))+". Mais lento: "+fmtT(Math.max(...tt))+"."});
    B.push({t:"ul",items:Object.keys(bands).map(k=>"Percentil "+k+": "+bands[k]+(bands[k]===1?" atleta.":" atletas."))});
    B.push({t:"p",x:"Percentis por idade segundo "+REF.src+"."});
  }
  const miss=list.filter(a=>!hasEval(a,mid));
  if(miss.length)B.push({t:"h",x:"Por avaliar"},{t:"p",x:miss.map(a=>a.name).join(", ")+"."});
  return r;
}
function buildReport(){
  const mid=curMid();
  if(ui.rep==="equipa")return{name:"relatorio-equipa-"+ESC[ui.esc],rep:repTeam(ui.esc,mid)};
  const a=state.athletes[ui.aid]||byEsc(ui.esc)[0];
  if(!a){const r=repHead("Relatórios",[ESC[ui.esc]]);r.blocks.push({t:"p",x:"Adiciona atletas "+ESC[ui.esc]+" na secção Equipa para gerar relatórios."});return{name:"relatorio",rep:r}}
  ui.aid=a.id;
  return{name:"relatorio-"+(ui.rep==="pais"?"familia-":"treinador-")+a.name,rep:repAthlete(a,mid,ui.rep==="pais")};
}
function repHtml(r){
  const li=x=>{const k=x.indexOf(": ");return k>0?`<li><strong>${esc(x.slice(0,k))}</strong>${esc(x.slice(k))}</li>`:`<li>${esc(x)}</li>`};
  return `<h2>${esc(r.title)}</h2><p><strong>${esc(r.sub)}</strong></p>`+r.blocks.map(b=>
    b.t==="h"?`<h3>${esc(b.x)}</h3>`:
    b.t==="p"?`<p>${esc(b.x)}</p>`:
    b.t==="ul"?`<ul>${b.items.map(li).join("")}</ul>`:
    b.t==="table"?`<div class="scroll"><table class="grid"><thead><tr>${b.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${b.rows.map(rw=>`<tr>${rw.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:
    b.t==="radar"?radar(b.vals,b.prev,b.names,280)+`<p class="small muted">${esc(b.key)}</p><ol class="legend">${b.names.map((n,i)=>`<li><b>${i+1}</b>${esc(n)}: ${esc(b.side[i])}</li>`).join("")}</ol>`:"").join("");
}
function repPdf(r){
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),M=18,W=210-2*M,INK=[20,39,78],MUT=[86,103,138],ACC=[232,100,27],LINE=[211,220,233];
  let y=36;
  const need=h=>{if(y+h>278){d.addPage();y=20}};
  d.setFillColor(...INK);d.rect(0,0,210,26,"F");d.setFillColor(...ACC);d.rect(0,26,210,1.5,"F");
  d.setTextColor(255,255,255);d.setFont("helvetica","bold");d.setFontSize(17);d.text(r.title,M,12);
  d.setFont("helvetica","normal");d.setFontSize(10.5);d.text(d.splitTextToSize(r.sub,W)[0]||"",M,19.5);
  for(const b of r.blocks){
    if(b.t==="h"){need(16);y+=3;d.setFont("helvetica","bold");d.setFontSize(12.5);d.setTextColor(...ACC);d.text(b.x,M,y);y+=6.5}
    else if(b.t==="p"){d.setFont("helvetica","normal");d.setFontSize(10.5);d.setTextColor(...INK);const ls=d.splitTextToSize(b.x,W);for(const l of ls){need(5.2);d.text(l,M,y);y+=5.2}y+=1.5}
    else if(b.t==="ul"){d.setFont("helvetica","normal");d.setFontSize(10.5);d.setTextColor(...INK);for(const it of b.items){const ls=d.splitTextToSize(it,W-6);need(ls.length*5.2);d.setFillColor(...ACC);d.circle(M+1.5,y-1.4,.8,"F");for(const l of ls){d.text(l,M+6,y);y+=5.2}y+=.8}y+=1}
    else if(b.t==="table"){
      const xs=[];let acc=M;b.w.forEach(f=>{xs.push(acc);acc+=f*W});
      const cell=(t,i,yy)=>{if(i===0)d.text(t,xs[0],yy);else d.text(t,xs[i]+b.w[i]*W/2,yy,{align:"center"})};
      need(12);d.setFont("helvetica","bold");d.setFontSize(9);d.setTextColor(...MUT);b.head.forEach((t,i)=>cell(d.splitTextToSize(t,b.w[i]*W-2)[0],i,y));y+=2;d.setDrawColor(...LINE);d.setLineWidth(.3);d.line(M,y,M+W,y);y+=4.6;
      d.setFont("helvetica","normal");d.setFontSize(10);d.setTextColor(...INK);
      for(const rw of b.rows){const ls=d.splitTextToSize(rw[0],b.w[0]*W-3),hgt=ls.length*4.6;need(hgt+2.5);ls.forEach((l,k)=>d.text(l,xs[0],y+k*4.6));for(let i=1;i<rw.length;i++)cell(rw[i],i,y);y+=hgt-2.6;d.setDrawColor(...LINE);d.setLineWidth(.15);d.line(M,y,M+W,y);y+=4.8}
      y+=2;
    }
    else if(b.t==="radar"){
      const n=b.vals.length,R=30,hgt=Math.max(2*R+16,n*6.4+6);need(hgt+8);const cx=M+R+8,cy=y+R+6;
      const pt=(v,i)=>{const t=(-90+360*i/n)*Math.PI/180;return[cx+R*v/5*Math.cos(t),cy+R*v/5*Math.sin(t)]};
      d.setDrawColor(...LINE);d.setLineWidth(.2);
      for(let k=1;k<=5;k++)for(let i=0;i<n;i++){const p=pt(k,i),q=pt(k,(i+1)%n);d.line(p[0],p[1],q[0],q[1])}
      d.setFont("helvetica","bold");d.setFontSize(9);d.setTextColor(...INK);
      for(let i=0;i<n;i++){const p=pt(5,i),q=pt(5.8,i);d.line(cx,cy,p[0],p[1]);d.text(String(i+1),q[0],q[1]+1.1,{align:"center"})}
      const poly=(vs,dash,colr,w)=>{const ps=vs.map((v,i)=>v>0?pt(v,i):null).filter(Boolean);if(ps.length<2)return ps;d.setDrawColor(...colr);d.setLineWidth(w);d.setLineDashPattern(dash,0);for(let i=0;i<ps.length;i++){if(ps.length===2&&i===1)break;const q=ps[(i+1)%ps.length];d.line(ps[i][0],ps[i][1],q[0],q[1])}d.setLineDashPattern([],0);return ps};
      if(b.prev)poly(b.prev,[1.3,1.1],MUT,.4);
      const ps=poly(b.vals,[],ACC,.8);d.setFillColor(...ACC);ps.forEach(p=>d.circle(p[0],p[1],.95,"F"));
      const lx=M+2*R+24;let ly=y+6;
      for(let i=0;i<n;i++){d.setFont("helvetica","bold");d.setFontSize(10);d.setTextColor(...ACC);d.text(String(i+1),lx,ly);d.setTextColor(...INK);d.setFont("helvetica","normal");d.text(d.splitTextToSize(b.names[i],58)[0],lx+6,ly);d.setTextColor(...MUT);d.text(b.side[i],M+W,ly,{align:"right"});ly+=6.4}
      y+=hgt+2;d.setFontSize(9);d.setTextColor(...MUT);d.text(d.splitTextToSize(b.key,W)[0],M,y);y+=7;
    }
  }
  const pages=d.getNumberOfPages();
  for(let i=1;i<=pages;i++){d.setPage(i);d.setFont("helvetica","normal");d.setFontSize(8.5);d.setTextColor(...MUT);d.text("Plataforma de Avaliação Técnica · Basquetebol de formação · gerado em "+fmtD(today()),M,289);d.text(i+" / "+pages,210-M,289,{align:"right"})}
  return d.output("blob");
}
function viewRel(){
  const cur=state.athletes[ui.aid],list=byEsc(cur?cur.esc:ui.esc);
  const types=[["pais","Para os pais"],["treinador","Treinador: atleta"],["equipa","Treinador: equipa"]];
  const b=buildReport();
  let h=`<section class="card"><div class="row"><label>Relatório <select id="repType" data-ch="rep">${types.map(t=>`<option value="${t[0]}" ${ui.rep===t[0]?"selected":""}>${t[1]}</option>`).join("")}</select></label>`;
  if(ui.rep!=="equipa")h+=`<label>Atleta <select id="repAth" data-ch="aid">${list.map(a=>`<option value="${a.id}" ${a.id===ui.aid?"selected":""}>${esc(a.name)}</option>`).join("")}</select></label>`;
  h+=momentSelect()+`</div><div class="row" style="margin-top:.8rem">${dl&&window.jspdf?`<button class="btn primary" data-act="savePdf">Guardar em PDF</button>`:""}<button class="btn" data-act="copy">Copiar texto</button><span class="small muted" id="repmsg" role="status"></span></div><p class="small muted">O relatório é gerado a partir da ficha: muda sozinho quando alteras uma avaliação. O relatório para os pais não mostra percentis nem compara com outros atletas.</p></section>`;
  return h+`<section class="card"><div class="report" id="report">${repHtml(b.rep)}</div></section>`;
}

function viewConfig(){
  const c=state.config;
  let h=`<section class="card"><h2>Equipa</h2><label>Nome do clube ou equipa<br><input type="text" id="team" data-ch="team" value="${esc(c.team)}" maxlength="80" style="width:min(100%,26rem)"></label></section>`;
  h+=`<section class="card"><h2>Momentos de avaliação</h2><p class="muted small">Os momentos são os pontos dos gráficos de evolução.</p>${c.moments.map((m,i)=>`<div class="row" style="margin:.35rem 0"><input type="text" id="mo-${m.id}" data-ch="mLabel" data-id="${m.id}" value="${esc(m.label)}" maxlength="30" aria-label="Momento ${i+1}"><button class="btn danger" data-act="rmMoment" data-id="${m.id}" ${c.moments.length<2?"disabled":""}>Remover</button></div>`).join("")}<button class="btn" data-act="addMoment" style="margin-top:.4rem">Adicionar momento</button></section>`;
  h+=`<section class="card"><h2>Competências por escalão</h2><p class="small muted">Escolhe as competências que entram na ficha de cada escalão. Cada ficha precisa de pelo menos três.</p>${ui.msg?`<p class="notice small">${esc(ui.msg)}</p>`:""}<div class="scroll"><table class="grid cfg"><thead><tr><th>Competência</th><th>Sub-8</th><th>Sub-10</th><th>Sub-12</th></tr></thead><tbody>${c.comps.map((k,i)=>`<tr><td><input type="text" id="cn-${k.id}" data-ch="compName" data-i="${i}" value="${esc(k.name)}" maxlength="60" aria-label="Nome da competência ${i+1}"></td>${Object.keys(ESC).map(e=>`<td><input type="checkbox" id="co-${k.id}-${e}" data-ch="compOn" data-i="${i}" data-e="${e}" ${k.on[e]!==false?"checked":""} aria-label="${esc(k.name)} em ${ESC[e]}"></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  h+=`<h3>Escala de 1 a 5</h3><div class="row">${c.levels.map((l,i)=>`<label>${i+1} <input type="text" id="lv-${i}" data-ch="level" data-i="${i}" value="${esc(l)}" maxlength="30" style="width:11rem"></label>`).join("")}</div></section>`;
  h+=`<section class="card"><h2>Dados</h2><p class="small muted">${mode==="db"?"Os atletas e as avaliações ficam guardados na tua conta e só tu os vês. Se partilhares esta página, cada treinador vê apenas a equipa que ele próprio inserir.":"Os dados estão guardados apenas neste navegador."}</p><button class="btn danger" data-act="wipe">${ui.confirmWipe?"Confirmar: apagar todos os atletas e avaliações":"Apagar todos os atletas"}</button></section>`;
  return h;
}

function render(){
  $("#teamline").textContent=(state.config.team?state.config.team+" · ":"")+"Basquetebol de formação · Sub-8, Sub-10 e Sub-12";
  $("#escseg").innerHTML=Object.keys(ESC).map(k=>`<button data-act="esc" data-esc="${k}" aria-pressed="${ui.esc===k}">${ESC[k]}</button>`).join("");
  const tabs=[["equipa","Equipa"],["ficha","Ficha individual"],["teste","Teste defensivo"],["relatorios","Relatórios"],["config","Configuração"]];
  $("#tabs").innerHTML=tabs.map(t=>`<button data-act="tab" data-tab="${t[0]}" ${ui.tab===t[0]?'aria-current="page"':""}>${t[1]}</button>`).join("");
  $("#app").innerHTML=ui.tab==="equipa"?viewEquipa():ui.tab==="ficha"?viewFicha():ui.tab==="teste"?viewTeste():ui.tab==="relatorios"?viewRel():viewConfig();
}

/* ---------- ações ---------- */
function ensureEval(a,mid){if(!a.evals[mid])a.evals[mid]={date:today(),s:{},def:[null,null,null],note:""};const e=a.evals[mid];if(!e.s)e.s={};if(!e.def)e.def=[null,null,null];return e}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}
    ta.remove();return ok;
  }
}
document.addEventListener("click",async evn=>{
  const b=evn.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,a=state.athletes[ui.aid];
  if(act!=="del")ui.confirmDel=null;if(act!=="wipe")ui.confirmWipe=false;ui.msg="";
  if(act==="tab"){ui.tab=b.dataset.tab}
  else if(act==="esc"){ui.esc=b.dataset.esc;if(a&&a.esc!==ui.esc)ui.aid=null;if(ui.tab==="ficha")ui.tab="equipa"}
  else if(act==="open"){if(!state.athletes[b.dataset.id])return;ui.aid=b.dataset.id;ui.tab="ficha";window.scrollTo(0,0)}
  else if(act==="rep"){ui.rep=b.dataset.rep;ui.tab="relatorios";window.scrollTo(0,0)}
  else if(act==="add"){
    const n=$("#newName").value.trim();if(!n){$("#newName").focus();return}
    const na={id:uid("a"),name:n,birth:$("#newBirth").value||"",esc:ui.esc,evals:{}};state.athletes[na.id]=na;save(na.id);
  }
  else if(act==="rmExample"){for(const x of Object.values(state.athletes))if(x.ex){delete state.athletes[x.id];save(x.id)}ui.aid=null}
  else if(act==="score"&&a){const e=ensureEval(a,curMid()),c=b.dataset.c,v=+b.dataset.v;if(e.s[c]===v)delete e.s[c];else e.s[c]=v;save(a.id)}
  else if(act==="del"&&a){if(ui.confirmDel!==a.id){ui.confirmDel=a.id}else{delete state.athletes[a.id];save(a.id);ui.aid=null;ui.confirmDel=null;ui.tab="equipa"}}
  else if(act==="addMoment"){state.config.moments.push({id:uid("m"),label:"Novo momento"});save("config")}
  else if(act==="rmMoment"){if(state.config.moments.length>1){state.config.moments=state.config.moments.filter(m=>m.id!==b.dataset.id);ui.mid=null;save("config")}}
  else if(act==="wipe"){if(!ui.confirmWipe){ui.confirmWipe=true}else{for(const id of Object.keys(state.athletes)){delete state.athletes[id];save(id)}ui.aid=null;ui.confirmWipe=false}}
  else if(act==="copy"){const ok=await copyText($("#report").innerText);$("#repmsg").textContent=ok?"Texto copiado":"Não foi possível copiar; seleciona o texto do relatório";return}
  else if(act==="savePdf"){
    const r=buildReport(),fn=r.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9-]+/g,"-").replace(/-+$/,"")+".pdf";
    try{await dl.save({filename:fn,data:repPdf(r.rep)});$("#repmsg").textContent="PDF guardado"}
    catch(e){$("#repmsg").textContent=e&&e.code==="declined"?"":"Não foi possível guardar o PDF aqui; usa Copiar texto"}
    return;
  }
  render();
});
document.addEventListener("change",evn=>{
  const el=evn.target,ch=el.dataset&&el.dataset.ch;if(!ch)return;
  const a=state.athletes[ui.aid],v=el.value,c=state.config;ui.msg="";
  if(ch==="mid")ui.mid=v;
  else if(ch==="rep")ui.rep=v;
  else if(ch==="aid")ui.aid=v;
  else if(ch==="team"){c.team=v.trim();save("config")}
  else if(ch==="mLabel"){const m=c.moments.find(m=>m.id===el.dataset.id);if(m&&v.trim()){m.label=v.trim();save("config")}}
  else if(ch==="compName"){if(v.trim()){c.comps[+el.dataset.i].name=v.trim();save("config")}}
  else if(ch==="compOn"){const e=el.dataset.e,k=c.comps[+el.dataset.i];if(!el.checked&&compsOf(e).length<=3)ui.msg="A ficha "+ESC[e]+" precisa de pelo menos três competências.";else{k.on[e]=el.checked;save("config")}}
  else if(ch==="level"){if(v.trim()){c.levels[+el.dataset.i]=v.trim();save("config")}}
  else if(a&&ch==="evDate"){if(v){ensureEval(a,curMid()).date=v;save(a.id)}}
  else if(a&&ch==="def"){const n=parseFloat(String(v).replace(",","."));ensureEval(a,curMid()).def[+el.dataset.k]=n>0&&n<600?Math.round(n*100)/100:null;save(a.id)}
  else if(a&&ch==="aName"){if(v.trim()){a.name=v.trim();save(a.id)}}
  else if(a&&ch==="aBirth"){a.birth=v;save(a.id)}
  else if(a&&ch==="aEsc"){a.esc=v;ui.esc=v;save(a.id)}
  render();
});
document.addEventListener("input",evn=>{
  if(evn.target.dataset&&evn.target.dataset.in==="note"){const a=state.athletes[ui.aid];if(a){ensureEval(a,curMid()).note=evn.target.value;save(a.id)}}
});
document.addEventListener("keydown",evn=>{if(evn.key==="Enter"&&evn.target.id==="newName"){const b=document.querySelector('[data-act="add"]');if(b)b.click()}});

/* ---------- arranque ---------- */
async function init(){
  let db=null,user=null;
  if(window.claude&&typeof window.claude.use==="function"){
    try{[db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")])}catch(e){}
  }
  let id=null;try{id=user?await user.id():null}catch(e){}
  if(db&&id){
    try{
      col=db.collection("data/users/"+id);
      const snap=await col.limit(1000).get();
      snap.docs.forEach(d=>{const v=clone(d.data());if(d.id==="config")state.config=v;else state.athletes[d.id]=v});
      mode="db";
    }catch(e){col=null;mode="local"}
  }
  if(mode==="local"){
    try{const raw=localStorage.getItem(LS_KEY);if(raw){const s=JSON.parse(raw);state.config=s.config;state.athletes=s.athletes||{}}}catch(e){}
  }
  normalize();
  const withAth=Object.keys(ESC).find(k=>byEsc(k).length);if(withAth)ui.esc=withAth;
  idleStatus();render();
}
init();
</script>
